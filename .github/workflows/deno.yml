name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Lint and test Supabase Edge Functions
        shell: bash
        run: |
          if [ -d "supabase/functions" ]; then
            deno lint --config supabase/functions/deno.json supabase/functions
            deno test --config supabase/functions/deno.json --permit-no-files -A supabase/functions
          else
            echo "No Supabase Edge Functions are present on this branch; Deno checks are not applicable."
          fi
