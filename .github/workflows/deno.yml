name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feature/upi-qr-checkout"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Lint and test Supabase Edge Functions
        shell: bash
        run: |
          if [ -d "supabase/functions" ]; then
            deno lint --config supabase/functions/deno.json supabase/functions
            if find supabase/functions -type f \\( -name "*_test.ts" -o -name "*_test.js" -o -name "*.test.ts" -o -name "*.test.js" \\) -print -quit | grep -q .; then
              deno test --config supabase/functions/deno.json -A supabase/functions
            else
              echo "No Deno test modules are present on this branch; lint completed."
            fi
          else
            echo "No Supabase Edge Functions are present; Deno checks are not applicable to this repository yet."
          fi
